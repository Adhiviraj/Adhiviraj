<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 370" width="490" height="370">
<style>
  .bg { fill: #0d1117; rx: 6px; }
  .title { font-family: monospace; font-size: 14px; fill: #58a6ff; font-weight: bold; }
  .key { font-family: monospace; font-size: 12px; fill: #79c0ff; font-weight: bold; }
  .val { font-family: monospace; font-size: 12px; fill: #c9d1d9; }
  .line { opacity: 0; animation: fadeIn 0.4s ease-in forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
<rect class="bg" width="100%" height="100%" />
<text x="25" y="40" class="title">adhiviraj@github ~ neofetch</text>
<line x1="25" y1="52" x2="465" y2="52" stroke="#30363d" stroke-width="1" />
<g class="line" style="animation-delay: 0.20s;">
  <text x="25" y="90" class="key">OS:</text>
  <text x="110" y="90" class="val">Ubuntu 24.04 LTS x86_64</text>
</g>
<g class="line" style="animation-delay: 0.35s;">
  <text x="25" y="135" class="key">Role:</text>
  <text x="110" y="135" class="val">ECE Undergrad & AI/ML Learner</text>
</g>
<g class="line" style="animation-delay: 0.50s;">
  <text x="25" y="180" class="key">Stack:</text>
  <text x="110" y="180" class="val">Python, C++, React, FastAPI, PyTorch</text>
</g>
<g class="line" style="animation-delay: 0.65s;">
  <text x="25" y="225" class="key">Focus:</text>
  <text x="110" y="225" class="val">Wafer Defect Detection & Computer Vision</text>
</g>
<g class="line" style="animation-delay: 0.80s;">
  <text x="25" y="270" class="key">Goal:</text>
  <text x="110" y="270" class="val">SDE Internship & Open Source</text>
</g>
</svg>